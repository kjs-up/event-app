version: '3.8'

services:
  # Database Services
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: event-platform-postgres
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: eventuser
      POSTGRES_PASSWORD: eventpass
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - event-platform
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventuser -d eventdb"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: event-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - event-platform
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  # API Gateway Service
  gateway:
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile.dev
    container_name: event-platform-gateway
    ports:
      - "3000:3000"
      - "9229:9229" # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://eventuser:eventpass@postgres:5432/eventdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - JWT_EXPIRES_IN=24h
      - PORT=3000
    volumes:
      - ../../services/gateway:/app
      - /app/node_modules
    networks:
      - event-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped

  # User Service
  user-service:
    build:
      context: ../../services/user-service
      dockerfile: Dockerfile.dev
    container_name: event-platform-user-service
    ports:
      - "3001:3001"
      - "9230:9229" # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://eventuser:eventpass@postgres:5432/eventdb
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=dev-jwt-secret-key-change-in-production
      - PORT=3001
    volumes:
      - ../../services/user-service:/app
      - /app/node_modules
    networks:
      - event-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped

  # Customer Portal Service
  customer-portal-service:
    build:
      context: ../../services/customer-portal-service
      dockerfile: Dockerfile.dev
    container_name: event-platform-customer-portal-service
    ports:
      - "3002:3002"
      - "9231:9229" # Debug port
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://eventuser:eventpass@postgres:5432/eventdb
      - REDIS_URL=redis://redis:6379
      - PORT=3002
    volumes:
      - ../../services/customer-portal-service:/app
      - /app/node_modules
    networks:
      - event-platform
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev
    restart: unless-stopped

  # Frontend Services
  customer-portal:
    build:
      context: ../../frontend/customer-portal
      dockerfile: Dockerfile.dev
    container_name: event-platform-customer-portal
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ../../frontend/customer-portal:/app
      - /app/node_modules
    networks:
      - event-platform
    depends_on:
      - gateway
    command: npm run dev
    restart: unless-stopped

  admin-portal:
    build:
      context: ../../frontend/admin-portal
      dockerfile: Dockerfile.dev
    container_name: event-platform-admin-portal
    ports:
      - "5174:5173"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:3000/api/v1
      - VITE_WS_URL=ws://localhost:3000
    volumes:
      - ../../frontend/admin-portal:/app
      - /app/node_modules
    networks:
      - event-platform
    depends_on:
      - gateway
    command: npm run dev
    restart: unless-stopped

  # Development Tools
  mailhog:
    image: mailhog/mailhog:latest
    container_name: event-platform-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - event-platform
    restart: unless-stopped

  # Optional: Database Admin Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: event-platform-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eventplatform.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - event-platform
    depends_on:
      - postgres
    restart: unless-stopped

  # Optional: Redis Admin Interface
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: event-platform-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    networks:
      - event-platform
    depends_on:
      - redis
    restart: unless-stopped

# Networks
networks:
  event-platform:
    driver: bridge
    name: event-platform-network

# Volumes
volumes:
  postgres_data:
    name: event-platform-postgres-data
  redis_data:
    name: event-platform-redis-data
  pgadmin_data:
    name: event-platform-pgadmin-data