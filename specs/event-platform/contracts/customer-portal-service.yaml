openapi: 3.0.3
info:
  title: Customer Portal Service API
  version: 1.0.0
  description: |
    Internal API for Customer Portal Service handling event requests, approval workflows,
    and customer management for the Enhanced Event Management Platform.

servers:
  - url: http://customer-portal-service:3000
    description: Internal service endpoint

paths:
  /internal/customers:
    post:
      summary: Create new customer account
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreateRequest'
      responses:
        '201':
          description: Customer created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

    get:
      summary: List customers (admin only)
      operationId: listCustomers
      parameters:
        - name: subscriptionTier
          in: query
          schema:
            type: string
            enum: [basic, premium, enterprise]
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'

  /internal/customers/{customerId}:
    get:
      summary: Get customer details
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      summary: Update customer information
      operationId: updateCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Customer updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /internal/event-requests:
    post:
      summary: Create new event request
      operationId: createEventRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequestCreateRequest'
      responses:
        '201':
          description: Event request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

    get:
      summary: List event requests
      operationId: listEventRequests
      parameters:
        - name: customerId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventRequestStatus'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of event requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequestList'

  /internal/event-requests/{requestId}:
    get:
      summary: Get event request details
      operationId: getEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

    patch:
      summary: Update event request
      operationId: updateEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequestUpdateRequest'
      responses:
        '200':
          description: Event request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

  /internal/event-requests/{requestId}/submit:
    post:
      summary: Submit event request for approval
      operationId: submitEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event request submitted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'
        '409':
          description: Cannot submit request in current status

  /internal/event-requests/{requestId}/approve:
    post:
      summary: Approve event request (admin only)
      operationId: approveEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Event request approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

  /internal/event-requests/{requestId}/reject:
    post:
      summary: Reject event request (admin only)
      operationId: rejectEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectionRequest'
      responses:
        '200':
          description: Event request rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

  /internal/event-requests/{requestId}/confirm:
    post:
      summary: Confirm approved event request (customer action)
      operationId: confirmEventRequest
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
      responses:
        '200':
          description: Event request confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRequest'

  /internal/workflows/{requestId}:
    get:
      summary: Get workflow steps for event request
      operationId: getWorkflowSteps
      parameters:
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workflow steps
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkflowStep'

components:
  schemas:
    CustomerCreateRequest:
      type: object
      required: [organizationName, contactEmail, subscriptionTier]
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 200
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        taxId:
          type: string
        preferredLanguage:
          type: string
          enum: [en, th]
          default: en
        subscriptionTier:
          type: string
          enum: [basic, premium, enterprise]

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organizationName:
          type: string
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        taxId:
          type: string
        preferredLanguage:
          type: string
          enum: [en, th]
        subscriptionTier:
          type: string
          enum: [basic, premium, enterprise]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        eventRequestCount:
          type: integer
        activeEventsCount:
          type: integer

    CustomerUpdateRequest:
      type: object
      properties:
        organizationName:
          type: string
          minLength: 1
          maxLength: 200
        contactEmail:
          type: string
          format: email
        contactPhone:
          type: string
        billingAddress:
          $ref: '#/components/schemas/Address'
        taxId:
          type: string
        preferredLanguage:
          type: string
          enum: [en, th]
        subscriptionTier:
          type: string
          enum: [basic, premium, enterprise]
        isActive:
          type: boolean

    CustomerList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        pagination:
          $ref: '#/components/schemas/Pagination'

    EventRequestCreateRequest:
      type: object
      required: [customerId, requestedEventName, eventType, estimatedCapacity, preferredDates, selectedModules]
      properties:
        customerId:
          type: string
          format: uuid
        requestedEventName:
          type: string
          minLength: 1
          maxLength: 200
        eventType:
          $ref: '#/components/schemas/EventType'
        estimatedCapacity:
          type: integer
          minimum: 1
          maximum: 10000
        preferredDates:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: date
        selectedModules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformModule'
        customRequirements:
          type: string
          maxLength: 2000
        attachmentUrls:
          type: array
          items:
            type: string
            format: uri

    EventRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        requestedEventName:
          type: string
        eventType:
          $ref: '#/components/schemas/EventType'
        estimatedCapacity:
          type: integer
        preferredDates:
          type: array
          items:
            type: string
            format: date
        selectedModules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformModule'
        customRequirements:
          type: string
        attachmentUrls:
          type: array
          items:
            type: string
            format: uri
        status:
          $ref: '#/components/schemas/EventRequestStatus'
        submittedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
        reviewedBy:
          type: string
          format: uuid
        reviewComments:
          type: string
        approvedAt:
          type: string
          format: date-time
        confirmedAt:
          type: string
          format: date-time
        launchedAt:
          type: string
          format: date-time
        generatedEventId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    EventRequestUpdateRequest:
      type: object
      properties:
        requestedEventName:
          type: string
          minLength: 1
          maxLength: 200
        eventType:
          $ref: '#/components/schemas/EventType'
        estimatedCapacity:
          type: integer
          minimum: 1
          maximum: 10000
        preferredDates:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            format: date
        selectedModules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformModule'
        customRequirements:
          type: string
          maxLength: 2000
        attachmentUrls:
          type: array
          items:
            type: string
            format: uri

    EventRequestList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventRequest'
        pagination:
          $ref: '#/components/schemas/Pagination'

    ApprovalRequest:
      type: object
      required: [reviewedBy]
      properties:
        reviewedBy:
          type: string
          format: uuid
        reviewComments:
          type: string
          maxLength: 1000
        suggestedCapacity:
          type: integer
        suggestedDates:
          type: array
          items:
            type: string
            format: date
        approvedModules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformModule'

    RejectionRequest:
      type: object
      required: [reviewedBy, reviewComments]
      properties:
        reviewedBy:
          type: string
          format: uuid
        reviewComments:
          type: string
          minLength: 1
          maxLength: 1000
        rejectionReason:
          type: string
          enum: [capacity_exceeded, module_unavailable, date_conflict, requirements_unclear, policy_violation]

    ConfirmationRequest:
      type: object
      required: [confirmedBy]
      properties:
        confirmedBy:
          type: string
          format: uuid
        finalEventName:
          type: string
        finalCapacity:
          type: integer
        finalDate:
          type: string
          format: date
        finalModules:
          type: array
          items:
            $ref: '#/components/schemas/PlatformModule'
        additionalNotes:
          type: string
          maxLength: 500

    WorkflowStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        requestId:
          type: string
          format: uuid
        stepType:
          type: string
          enum: [submitted, under_review, approved, rejected, confirmed, launched]
        performedBy:
          type: string
          format: uuid
        performedAt:
          type: string
          format: date-time
        notes:
          type: string
        metadata:
          type: object

    EventRequestStatus:
      type: string
      enum: [draft, submitted, under_review, approved, rejected, confirmed, launched]

    EventType:
      type: string
      enum: [concert, conference, training, seminar, workshop, networking, motor_show, tech_talk]

    PlatformModule:
      type: string
      enum: [
        basic_registration,
        advanced_ticketing,
        seat_management,
        vip_management,
        speaker_management,
        analytics_dashboard,
        multi_language,
        compliance_suite
      ]

    Address:
      type: object
      properties:
        street:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        country:
          type: string
          pattern: '^[A-Z]{2}$'

    Pagination:
      type: object
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean

    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'